[build-system]
requires = ["setuptools>=68", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "yoga1290.emailtable"
readme = "readme.md"
version = "0.1.1"
description = "Pulls, drafts and sends emails (IMAP & SMTP) based on CSV tables"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["./"]

[project.urls]
Homepage = "https://github.com/yoga1290/python-emailtable#readme"
Issues = "https://github.com/yoga1290/python-emailtable/issues"
services:

  notebook:
    container_name: notebook-emailtable
    image: quay.io/jupyter/base-notebook:ubuntu-24.04
    env_file:
      - .env
    ports:
      - 8888:8888
    volumes:
      - ./:/home/jovyan
  
  emailtable:
    env_file:
      - .env
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    command:
      - pip install yoga1290.emailtable && python
      - -c
      - |
        from yoga1290.email2csv import proccessCSVDrafts
        from yoga1290.email2csv import processIMAPToCSV
        from yoga1290.email2csv import processSMTP
        # ....
